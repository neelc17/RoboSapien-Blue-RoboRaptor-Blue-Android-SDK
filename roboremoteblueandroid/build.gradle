apply plugin: 'com.android.application'

android {
    namespace "com.wowwee.roboremotebluesampleproject"
    compileSdk 34

    defaultConfig {
        applicationId "com.wowwee.roboremotebluesampleproject"
        minSdk 21
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation files('libs/bluetoothrobotcontrollib.jar')
    implementation 'com.android.support:support-v4:28.0.0'
}
